name: desktop

# One portable file per platform, built natively on each runner and checked by
# running it. Every push to main refreshes the rolling "nightly" release, so the
# newest binaries are always one click away under the repository's downloads.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: multidrop-web-linux-x64
            exe: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: multidrop-web-linux-arm64
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: multidrop-web-macos-x64
            exe: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset: multidrop-web-macos-arm64
            exe: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: multidrop-web-windows-x64.exe
            exe: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: multidrop-web-windows-arm64.exe
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary serves the app
        working-directory: desktop
        run: ./target/${{ matrix.target }}/release/multidrop-web${{ matrix.exe }} --selftest
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/target/${{ matrix.target }}/release/multidrop-web${{ matrix.exe }} "dist/${{ matrix.asset }}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  nightly:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: multidrop-web-*
          path: dist
          merge-multiple: true
      - name: Replace the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease \
            --title "MultiDrop web (nightly)" \
            --notes "Built from main by CI on every push. One portable file per platform: run it, and the app opens in your browser. Replaced on every push."
          gh release upload nightly dist/* --clobber
          gh release edit nightly --notes "Built from ${GITHUB_SHA::7} by CI. One portable file per platform: run it, and the app opens in your browser. Replaced on every push."
