name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AirPlay receiver for the RAOP interop test
        run: sudo apt-get install -y -qq shairport-sync
      - run: pip install -e ".[test]" ruff
      - name: Lint (ruff)
        run: ruff check src tests tools
      - run: pytest -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[windows]" pyinstaller
      - name: Build MultiDrop.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MultiDrop
          --icon data/icons/multidrop.ico
          --add-data "data/icons/multidrop.png;data/icons"
          --collect-all multidrop --collect-all zeroconf --collect-all soundcard --collect-all webview
          --hidden-import pystray._win32
          packaging/windows/launch.py
      - name: Self-test (starts Quick Share + LocalSend, checks the API)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist\MultiDrop.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); $code = "timeout" } else { $code = $p.ExitCode }
          Get-Content "$env:LOCALAPPDATA\multidrop\multidrop.log" -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "self-test failed: $code" }
      - name: Build MultiDrop-Setup.exe (Inno Setup, per-user install)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" packaging\windows\multidrop.iss
          if ($LASTEXITCODE) { throw "iscc failed: $LASTEXITCODE" }
      - name: Install, check and uninstall
        shell: pwsh
        timeout-minutes: 5
        run: packaging/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MultiDrop-windows
          path: |
            dist/MultiDrop.exe
            dist/MultiDrop-Setup.exe

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build multidrop_*_all.deb
        run: packaging/deb/build-deb.sh dist
      - name: Install it and check the programs start
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/multidrop_*_all.deb
          multidrop --version
          multidropd --help >/dev/null
          python3 -I -c "import sys; sys.path[:0]=['/usr/lib/multidrop','/usr/lib/multidrop/vendor']; import multidrop.daemon, aiohttp, google.protobuf; print('aiohttp', aiohttp.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiDrop-deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, test-windows, windows, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/download-artifact@v4
        with:
          name: MultiDrop-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: MultiDrop-windows
          path: dist
      - name: Linux bundle
        run: |
          name=MultiDrop-linux-${GITHUB_REF_NAME}
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "MultiDrop $GITHUB_REF_NAME"
          --notes-file packaging/RELEASE_NOTES.md

  apt-repo:
    # Signed APT repository on GitHub Pages (gh-pages branch):
    #   sudo apt install multidrop   after adding it once, see README.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: MultiDrop-deb
          path: dist
      - name: Update and sign the repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_KEY_ID: ${{ secrets.APT_KEY_ID }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          echo "$APT_GPG_KEY" | gpg --batch --import
          packaging/deb/update-apt-repo.sh site dist/*.deb
      - name: Publish
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APT repository: ${GITHUB_REF_NAME}"
          git push

  web:
    # Browser build (pages/) published to web/ on gh-pages, beside the APT repo at its root.
    # Only the page files and wireweave's src/ are copied, not the submodule's repo metadata.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out gh-pages (start it on the first publish)
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "$url" site
          else
            git init -q -b gh-pages site
            git -C site remote add origin "$url"
          fi
      - name: Copy the web build into web/
        run: |
          rm -rf site/web && mkdir -p site/web/vendor/wireweave
          cp pages/index.html pages/app.js pages/wire.js pages/style.css site/web/
          cp -r pages/vendor/wireweave/src site/web/vendor/wireweave/
      - name: Publish
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Web build: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
