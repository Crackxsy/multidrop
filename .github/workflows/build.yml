name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  pages:
    # Website on GitHub Pages (gh-pages branch, next to the APT repository),
    # built from site/strings.toml by tools/build_site.py. The branch is
    # checked out to gh-pages/, as site/ holds the sources.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.WEB_AT_ROOT != 'true'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/build_site.py build/site
      - name: Publish
        run: |
          cp -r build/site/. gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Website: ${GITHUB_SHA::7}" && git push; }

  web:
    # Browser build (pages/) published to web/ on gh-pages, beside the APT repo at its root.
    # Only the page files and wireweave's src/ are copied, not the submodule's repo metadata.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out gh-pages (start it on the first publish)
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "$url" web-site
          else
            git init -q -b gh-pages web-site
            git -C web-site remote add origin "$url"
          fi
      - name: Copy the web build into web/
        run: |
          rm -rf web-site/web && mkdir -p web-site/web/vendor/wireweave
          cp pages/index.html pages/app.js pages/wire.js pages/style.css web-site/web/
          cp -r pages/vendor/wireweave/src web-site/web/vendor/wireweave/
      - name: Serve the app at the site root too (repository variable WEB_AT_ROOT=true, set on forks)
        if: vars.WEB_AT_ROOT == 'true'
        run: |
          # Remove exactly the files the website job would have published, so nothing
          # else on the branch (such as the APT repository) is touched.
          python3 tools/build_site.py build/site >/dev/null
          python3 -c "import pathlib; print('\n'.join(str(p) for p in pathlib.Path('build/site').rglob('*') if p.is_file()))" \
            | while read -r f; do rm -f "web-site/${f#build/site/}"; done
          cp pages/index.html pages/app.js pages/wire.js pages/style.css web-site/
          mkdir -p web-site/vendor/wireweave
          cp -r pages/vendor/wireweave/src web-site/vendor/wireweave/
          touch web-site/.nojekyll
      - name: Publish
        run: |
          cd web-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Web build: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
